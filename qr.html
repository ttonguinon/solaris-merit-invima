<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de QR · Solaris Merit</title>
<link rel="icon" href="marca/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--noche:#0E1E40;--card:#12234A;--linea:#24386A;--sol:#FFE27A;--dorado:#FFB547;--naranja:#F28C1B;--lav:#C9D6FF;--cielo:#3D8BFF}
body{margin:0;min-height:100vh;padding:20px;color:#EEF2FF;font-family:"Atkinson Hyperlegible",Arial,sans-serif;
 background:radial-gradient(circle at 80% 10%,rgba(255,181,71,.22),transparent 38%),linear-gradient(135deg,#0A1630,#132B5E 60%,#1E3F8A)}
.wrap{max-width:560px;margin:0 auto}
h1{font-family:"Baloo 2",sans-serif;font-size:2rem;margin:0 0 4px;background:linear-gradient(90deg,#FFE27A,#F28C1B);-webkit-background-clip:text;background-clip:text;color:transparent}
p.lead{color:var(--lav);margin:0 0 18px}
label{display:block;font-weight:700;margin:14px 0 4px}
input,select{width:100%;padding:11px 12px;border-radius:12px;border:2px solid var(--linea);background:#0A1630;color:#fff;font:inherit}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button{border:0;border-radius:14px;padding:12px 18px;font-weight:700;cursor:pointer;font-family:inherit;
 background:linear-gradient(120deg,#FFB547,#F28C1B);color:#0E1E40;box-shadow:0 4px 0 #C0551E}
button.sec{background:var(--card);color:#8CCBFF;box-shadow:0 4px 0 var(--linea)}
#salida{margin-top:22px;text-align:center}
#lienzo{background:#fff;border-radius:16px;padding:14px;display:inline-block}
small{color:var(--lav)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Generador de QR</h1>
  <p class="lead">Crea el código de tu enlace con los colores de Solaris Merit y descárgalo para imprimir o compartir.</p>
  <label for="url">Enlace</label>
  <input id="url" type="url" value="https://ttonguinon.github.io/solaris-merit-invima/" placeholder="https://...">
  <label for="tam">Tamaño</label>
  <select id="tam"><option value="600">600 px · pantalla</option><option value="1000" selected>1000 px · imprimir</option><option value="2000">2000 px · pendón</option></select>
  <div class="btns">
    <button id="gen">Generar QR</button>
    <button id="bajar" class="sec">Descargar PNG</button>
  </div>
  <div id="salida"><div id="lienzo"></div><p><small id="pie"></small></p></div>
</div>
<script>
const $=s=>document.querySelector(s);
let canvas=null;
function generar(){
  const url=$("#url").value.trim(); if(!url) return;
  const px=+$("#tam").value;
  const qr=qrcode(0,"H"); qr.addData(url); qr.make();
  const n=qr.getModuleCount(), borde=4, total=n+borde*2, celda=Math.floor(px/total);
  canvas=document.createElement("canvas"); canvas.width=canvas.height=celda*total;
  const x=canvas.getContext("2d");
  x.fillStyle="#FFFFFF"; x.fillRect(0,0,canvas.width,canvas.height);
  x.fillStyle="#0E1E40";
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(qr.isDark(r,c)) x.fillRect((c+borde)*celda,(r+borde)*celda,celda,celda);
  const lado=Math.round(canvas.width*0.16), pad=Math.round(lado*0.12);
  const img=new Image();
  img.onload=()=>{
    x.fillStyle="#FFFFFF";
    x.fillRect((canvas.width-lado)/2-pad,(canvas.height-lado)/2-pad,lado+2*pad,lado+2*pad);
    x.drawImage(img,(canvas.width-lado)/2,(canvas.height-lado)/2,lado,lado);
    pintar();
  };
  img.onerror=pintar;
  img.src="marca/icon-512.png";
  function pintar(){ const l=$("#lienzo"); l.innerHTML=""; canvas.style.width="min(320px,80vw)"; canvas.style.height="auto"; l.appendChild(canvas); $("#pie").textContent=url; }
}
$("#gen").onclick=generar;
$("#bajar").onclick=()=>{ if(!canvas) generar(); if(!canvas) return;
  const a=document.createElement("a"); a.download="qr-solaris-merit.png"; a.href=canvas.toDataURL("image/png"); a.click(); };
generar();
</script>
</body>
</html>
